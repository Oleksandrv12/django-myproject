<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset hesla</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:40px 20px;">
        <tr><td align="center">
            <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:16px;padding:40px;">
                <tr><td align="center">
                    <h1 style="margin:0 0 16px;color:#222;">🔐 Reset hesla</h1>
                    <p style="color:#555;font-size:16px;line-height:1.6;">Ahoj {{ user.username }},</p>
                    <p style="color:#555;font-size:16px;line-height:1.6;">Obdrželi jsme požadavek na obnovení hesla k tvému účtu. Klikni na tlačítko níže a nastav si nové heslo.</p>
                    <table cellpadding="0" cellspacing="0" style="margin:30px auto;">
                        <tr><td bgcolor="#ffc107" style="border-radius:8px;">
                            <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}" style="display:inline-block;padding:14px 28px;font-size:16px;font-weight:bold;color:#000;text-decoration:none;">Resetovat heslo</a>
                        </td></tr>
                    </table>
                    <p style="color:#777;font-size:14px;line-height:1.6;">Pokud jsi o reset hesla nežádal, tento e-mail můžeš ignorovat.</p>
                    <hr style="border:none;border-top:1px solid #eee;margin:30px 0;">
                    <p style="color:#999;font-size:12px;">Tento e-mail byl odeslán automaticky.</p>
                </td></tr>
            </table>
        </td></tr>
    </table>
</body>
</html>
